plugins:
  added_to_group_notifier_enabled:
    default: true
    client: false

  added_to_group_notifier_groups:
    default: ""
    type: group_list
    list_type: compact
    allow_any: false
    client: false

  added_to_group_notifier_recipient_usernames:
    default: ""
    type: text
    description: "Pipe-separated usernames that should receive notification private messages."
    client: false

  added_to_group_notifier_recipient_groups:
    default: ""
    type: group_list
    list_type: compact
    allow_any: false
    client: false

  added_to_group_notifier_pm_title:
    default: "New member in %{group_name}"
    type: string
    description: "Notification private-message title template."
    client: false

  added_to_group_notifier_pm_body:
    default: "%{username} was just added to the %{group_name} group at %{added_at}."
    type: text
    textarea: true
    description: "Notification private-message body template."
    client: false
