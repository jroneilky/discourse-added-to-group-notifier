plugins:
  group_add_notifier_enabled:
    default: false
    client: false

  # Groups to watch. Multi-select group picker in the admin UI.
  group_add_notifier_groups:
    default: ""
    type: group_list
    list_type: compact
    client: false

  # Pipe-separated usernames to PM. Edited as a text string.
  group_add_notifier_recipient_usernames:
    default: ""
    type: string
    client: false

  # Optional: groups to PM instead of (or in addition to) individual usernames.
  group_add_notifier_recipient_groups:
    default: ""
    type: group_list
    list_type: compact
    client: false

  group_add_notifier_pm_title:
    default: "New member in %{group_name}"
    client: false

  group_add_notifier_pm_body:
    default: "%{username} was just added to the %{group_name} group at %{added_at}."
    client: false
